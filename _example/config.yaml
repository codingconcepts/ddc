age: 1m

root_paths:
  - ~/dev
  - ~/Movies
  - ~/Downloads

docker_unused_images: 500MB 3m

docker_image_keep_latest: 1

docker_image_prefix_include:
  cockroachdb: 6w
  codingconcepts: 1m
  golang: 3m
  lldap: 1m
  mongo: 6m
  mysql: 6m
  nginx: 6m
  node: 3m
  postgres: 6m
  python: 3m
  redis: 6m
  redpandadata:
  traefik: 6m

docker_image_prefix_exclude:
  - container-registry.oracle.com

docker_build_cache: 1w

docker_volume_prune:
  anonymous: true
  named: false
  age: 1m

docker_container_prune: true
docker_network_prune: true

temp_cleanup: true

bazel_cleanup:
  clean: true
  expunge: false
  expunge_async: false

go_cleanup:
  cache: true
  modcache: true
  testcache: true
  fuzzcache: true

homebrew_cleanup: true

git_gc:
  size: 100MB
  prune: 2w

git_clean_branches: true

delete_directories:
  __pycache__: 1MB 1m
  .angular/cache: 50MB 1m
  .cache: 50MB 6m
  .dart_tool: 10MB 1m
  .gradle: 100MB 1m
  .ipynb_checkpoints: 1MB 1m
  .mypy_cache: 10MB 1m
  .next: 50MB 1m
  .nuxt: 50MB 1m
  .parcel-cache: 50MB 1m
  .pytest_cache: 1MB 1m
  .terraform/providers: 10MB 6m
  .tox: 100MB 6m
  .turbo: 50MB 1m
  .venv: 100MB 6m
  build: 50MB 6m
  coverage: 10MB 6m
  dist: 50MB 6m
  elm-stuff: 50MB
  node_modules: 10MB 1m
  out: 50MB 6m
  Pods: 100MB 1m
  target: 100MB 6m
  vendor: 50MB 6m
  venv: 100MB 6m
  zig-cache: 50MB 1m
  zig-out: 50MB 1m

delete_files:
  .core: 1MB 1w
  .csv: 50MB 1y
  .db: 50MB 6m
  .dmg: 10MB 3m
  .DS_Store: 1B
  .dump: 1MB 1w
  .egg: 50MB 6m
  .heapsnapshot: 1MB 1w
  .iso: 100MB 3m
  .jar: 50MB 6m
  .log: 10MB 6m
  .map: 10MB 6m
  .mp4: 50MB 1.5y
  .pack: 50MB 6m
  .pprof: 10MB 1m
  .prof: 10MB 1m
  .sqlite: 50MB 6m
  .tgz: 10MB 6m
  .war: 50MB 6m
  .wasm: 50MB 6m
  .whl: 50MB 6m
  .zip: 10MB 6m

delete_paths:
  ~/.cache/bazel: 100MB 1m
  ~/.cache/pip: 100MB 3m
  ~/.cache/yarn: 100MB 3m
  ~/.cargo/registry: 100MB 3m
  ~/.m2/repository: 100MB 6m
  ~/.npm/_cacache: 100MB 3m
  ~/.nuget/packages: 100MB 6m
  ~/.pub-cache: 100MB 6m
  ~/Library/Caches/Google: 1GB
  ~/Library/Caches/rancher-desktop-updater: 500MB
  ~/Library/Caches/goimports: 500MB
  ~/Library/Developer/CoreSimulator: 100MB 1m
  ~/Library/Developer/Xcode/DerivedData: 100MB

ignore_directories:
  - .git
  - digital_human
  - Movies/TV
  - prerender
